<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>Velvet Keys</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0b0b;
        color: #f8f9fa;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.08), transparent 60%);
      }
      svg {
        width: 64px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.75rem;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        max-width: 24rem;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #a1a1aa;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border-radius: 0.375rem;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
      }
      button {
        border: 0;
        background: #d4af37;
        color: #0b0b0b;
      }
      a {
        border: 1px solid rgba(212, 175, 55, 0.4);
        color: #d4af37;
      }
      :focus-visible {
        outline: 2px solid #fff1be;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        viewBox="0 0 80 120"
        fill="none"
        stroke="#D4AF37"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="40" cy="28" r="19" stroke-width="1.6" />
        <circle cx="40" cy="28" r="15.5" stroke-width="0.9" stroke-opacity="0.85" />
        <path
          d="M31 21.5 37.5 34.5 43.5 28M43.5 21.5V34.5M43.5 28 49.5 21.5M43.5 28 49.5 34.5"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path d="M36.5 48H43.5M40 48V105M40 92H47.5M40 99H49" stroke-width="2.1" />
      </svg>
      <h1 id="title">You're offline</h1>
      <p id="text">This page isn't saved on your device yet. Reconnect to open it.</p>
      <div class="actions">
        <button type="button" id="retry">Try again</button>
        <a href="/login" id="home">Open Velvet Keys</a>
      </div>
    </main>
    <script>
      // Static page without the app's i18n, so the three languages live here
      var copy = {
        en: {
          title: "You're offline",
          text: "This page isn't saved on your device yet. Reconnect to open it.",
          retry: "Try again",
          home: "Open Velvet Keys",
        },
        fr: {
          title: "Vous êtes hors ligne",
          text: "Cette page n'est pas encore enregistrée sur votre appareil. Reconnectez-vous pour l'ouvrir.",
          retry: "Réessayer",
          home: "Ouvrir Velvet Keys",
        },
        ar: {
          title: "أنت غير متصل بالإنترنت",
          text: "هذه الصفحة غير محفوظة على جهازك بعد. أعد الاتصال لفتحها.",
          retry: "حاول مرة أخرى",
          home: "فتح Velvet Keys",
        },
      };
      var lang = "en";
      try {
        lang = localStorage.getItem("i18n_lang") || "en";
      } catch (e) {}
      var strings = copy[lang] || copy.en;
      document.documentElement.lang = lang in copy ? lang : "en";
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.getElementById("title").textContent = strings.title;
      document.getElementById("text").textContent = strings.text;
      document.getElementById("retry").textContent = strings.retry;
      document.getElementById("home").textContent = strings.home;
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
    </script>
  </body>
</html>
